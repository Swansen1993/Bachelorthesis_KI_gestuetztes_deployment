name: Github Actions Pipeline
on: 
  push:
    branches : [ "main" ]

permissions:
  id-token: write
  contents: read
   
env: 
  AWS_REGION : eu-central-1
  ROLE_TO_ASSUME: arn:aws:iam::415221799955:role/github_worklow_aws
  ECR_APP_REPO: app-repo
  ECR_LOCUST_REPO: locust-repo

   
jobs:
  Build-and-Deploy: 
        runs-on: ubuntu-latest
 
        steps:

          - name: Configure AWS 
            uses: actions/checkout@v5

          - name: AWS_Credentials_Via_OIDC
            uses: aws-actions/configure-aws-credentials@v4
            with:
             aws-region: ${{env.AWS_REGION}}
             role-to-assume: ${{env.ROLE_TO_ASSUME}}

          - name: Login to AWSECR
            uses: aws-actions/amazon-ecr-login@v2
            id: login-ecr
          
          - name: Build and Push App image in AWSECR
            env: 
              REGISTRY: ${{steps.login-ecr.outputs.registry}}
              IMAGE_TAG: ${{github.sha}}
            run: 
              docker build -t $REGISTRY/$ECR_APP_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_APP_REPO:latest terraform/applikation/code &&
              docker push $REGISTRY/$ECR_APP_REPO:$IMAGE_TAG &&
              docker push $REGISTRY/$ECR_APP_REPO:latest


          - name: Build and Push Locust image in AWSECR 
            env: 
              REGISTRY: ${{steps.login-ecr.outputs.registry}}
              IMAGE_TAG: ${{github.sha}}
            run: 
              docker build -t $REGISTRY/$ECR_LOCUST_REPO:$IMAGE_TAG -t $REGISTRY/$ECR_LOCUST_REPO:latest terraform/tests/locust &&
              docker push $REGISTRY/$ECR_LOCUST_REPO:$IMAGE_TAG &&
              docker push $REGISTRY/$ECR_LOCUST_REPO:lastest
          
          - name: setup Terraform 
            uses: hashicorp/setup-terraform@v3
            with: 
              terraform_version: 1.5.0

          - name: terraform Init und apply
            env:
              REGISTRY: ${{steps.login-ecr.outputs.registry}}
              IMAGE_TAG: ${{github.sha}}
            run:
              terraform init
              terraform apply-auto-approve\
              - var="app_image_uri=$REGISTRY/$ECR_APP_REPO:$IMAGE_TAG"
              - var="locust_image_uri=$REGISTRY/$ECR_LOCUST_REPO:$IMAGE_TAG"


            


    
